name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: beatthestreak
  STACK_NAME: beatthestreak-stack
  IMAGE_TAG: latest
  ENVIRONMENT: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Suppress git default branch warning
        run: git config --global init.defaultBranch main

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mlb-cicd-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --no-cache -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker logout $REGISTRY

      - name: Deploy CloudFormation stack
        run: |
          set +e
          aws cloudformation deploy \
            --template-file infrastructure.yaml \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment=$ENVIRONMENT \
              ImageTag=$IMAGE_TAG \
              ContainerPort=8080 \
              ForceRedeploy=$(date +%s) \
              EnableScheduledPredictions=true \
              EnablePublicAPI=true \
              EnableAutoRetrain=true \
              AlertEmail=${{ secrets.ALERT_EMAIL }} \
            --no-fail-on-empty-changeset
          CFN_EXIT=$?
          if [ $CFN_EXIT -ne 0 ]; then
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name $STACK_NAME \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null)
            if [[ "$STATUS" == "UPDATE_COMPLETE" || "$STATUS" == "CREATE_COMPLETE" ]]; then
              echo "Stack is healthy ($STATUS) — no infrastructure changes, continuing"
            else
              echo "CloudFormation failed — stack status: $STATUS"
              exit 1
            fi
          fi

      - name: Package Lambdas
        run: |
          cd mlb_predictor/lambda
          zip prediction_trigger.zip prediction_trigger.py
          zip model_retrainer.zip model_retrainer.py
          # check_actuals.zip now includes predictions_log.py for v1.5 analytics enrichment.
          # The file lives one level up in the mlb_predictor package, so we zip it from there
          # into a subdirectory to preserve the `from mlb_predictor.predictions_log import ...`
          # import path that check_actuals.py uses.
          mkdir -p _build/mlb_predictor
          cp check_actuals.py _build/
          cp ../predictions_log.py _build/mlb_predictor/
          touch _build/mlb_predictor/__init__.py
          (cd _build && zip -r ../check_actuals.zip .)
          rm -rf _build
          aws s3 cp prediction_trigger.zip s3://mlb-hit-predictor-$ENVIRONMENT-bucket/lambda/
          aws s3 cp model_retrainer.zip s3://mlb-hit-predictor-$ENVIRONMENT-bucket/lambda/
          aws s3 cp check_actuals.zip s3://mlb-hit-predictor-$ENVIRONMENT-bucket/lambda/

      # v1.5.2 fix: CloudFormation's AWS::Lambda::Function resource does NOT detect
      # content changes to the S3 zip — it only triggers a Lambda update when the
      # S3Bucket or S3Key parameters change. Uploading new bytes to the SAME key
      # leaves the Lambda running its previously-loaded code until something else
      # forces a code reload.
      #
      # This was caught on 2026-04-12 when v1.5.2 zips were on S3 but the Lambda
      # kept running v1.5.1 code (no [HEALTH] probe logs despite the probe being
      # in the deployed zip). The manual fix was `aws lambda update-function-code`
      # against each function — which is what this step now does automatically.
      #
      # `update-function-code` tells Lambda to pull the latest zip from the given
      # S3 key and reload the runtime. Idempotent, safe to run on every deploy,
      # and only triggers a cold start on the next invocation (no traffic impact
      # during update since Lambda handles this transparently).
      - name: Force Lambda code reload
        run: |
          # Explicit function name → zip key mapping. Don't try to derive
          # one from the other — the actuals-checker Lambda uses check_actuals.zip
          # (not actuals_checker.zip) so any rule-based transform will break.
          declare -A LAMBDAS=(
            ["$ENVIRONMENT-prediction-trigger"]="lambda/prediction_trigger.zip"
            ["$ENVIRONMENT-model-retrainer"]="lambda/model_retrainer.zip"
            ["$ENVIRONMENT-actuals-checker"]="lambda/check_actuals.zip"
          )
          for FULL_NAME in "${!LAMBDAS[@]}"; do
            ZIP_KEY="${LAMBDAS[$FULL_NAME]}"
            echo "Reloading $FULL_NAME from s3://mlb-hit-predictor-$ENVIRONMENT-bucket/$ZIP_KEY"
            aws lambda update-function-code \
              --function-name "$FULL_NAME" \
              --s3-bucket "mlb-hit-predictor-$ENVIRONMENT-bucket" \
              --s3-key "$ZIP_KEY" \
              --publish \
              --no-cli-pager > /dev/null
            aws lambda wait function-updated --function-name "$FULL_NAME"
            echo "  ✓ $FULL_NAME reload complete"
          done

      - name: Force new ECS deployment
        run: |
          SERVICE=$(aws ecs list-services --cluster $ENVIRONMENT-cluster --query 'serviceArns[0]' --output text | xargs basename)
          aws ecs update-service --cluster $ENVIRONMENT-cluster --service $SERVICE --force-new-deployment --region $AWS_REGION

      - name: Wait for service stability
        run: |
          SERVICE=$(aws ecs list-services --cluster $ENVIRONMENT-cluster --query 'serviceArns[0]' --output text | xargs basename)
          aws ecs wait services-stable --cluster $ENVIRONMENT-cluster --services $SERVICE --region $AWS_REGION

      - name: Smoke test
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster $ENVIRONMENT-cluster --query 'taskArns[0]' --output text)
          ENI=$(aws ecs describe-tasks --cluster $ENVIRONMENT-cluster --tasks $TASK_ARN --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          echo "Task IP: $IP"

          curl -sf http://$IP:8080/health | grep -q '"healthy"' || { echo "FAIL: /health"; exit 1; }
          curl -sf http://$IP:8080/ | grep -q '"BeatTheStreak"' || { echo "FAIL: /"; exit 1; }
          curl -sf http://$IP:8080/test | grep -q '"pass"' || { echo "FAIL: /test"; exit 1; }
          echo "All smoke tests passed!"