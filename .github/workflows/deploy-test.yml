name: Deploy to Test

on:
  push:
    branches:
      - test

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: beatthestreak
  STACK_NAME: beatthestreak-test-stack
  IMAGE_TAG: test
  ENVIRONMENT: test

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mlb-cicd-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build --no-cache -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Package Lambda
        run: |
          cd mlb_predictor/lambda
          zip prediction_trigger.zip prediction_trigger.py
          aws s3 cp prediction_trigger.zip s3://mlb-hit-predictor-$ENVIRONMENT-bucket/lambda/

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure.yaml \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment=$ENVIRONMENT \
              ImageTag=$IMAGE_TAG \
              ContainerPort=8080 \
              ForceRedeploy=$(date +%s) \
              EnableScheduledPredictions=false \
            --no-fail-on-empty-changeset || true

      - name: Force new ECS deployment
        run: |
          SERVICE=$(aws ecs list-services --cluster $ENVIRONMENT-cluster --query 'serviceArns[0]' --output text | xargs basename)
          aws ecs update-service --cluster $ENVIRONMENT-cluster --service $SERVICE --force-new-deployment --region $AWS_REGION

      - name: Wait for service stability
        run: |
          SERVICE=$(aws ecs list-services --cluster $ENVIRONMENT-cluster --query 'serviceArns[0]' --output text | xargs basename)
          aws ecs wait services-stable --cluster $ENVIRONMENT-cluster --services $SERVICE --region $AWS_REGION

      - name: Smoke test
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster $ENVIRONMENT-cluster --query 'taskArns[0]' --output text)
          ENI=$(aws ecs describe-tasks --cluster $ENVIRONMENT-cluster --tasks $TASK_ARN --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          echo "Task IP: $IP"

          curl -sf http://$IP:8080/health | grep -q '"healthy"' || { echo "FAIL: /health"; exit 1; }
          curl -sf http://$IP:8080/ | grep -q '"BeatTheStreak"' || { echo "FAIL: /"; exit 1; }
          curl -sf http://$IP:8080/test | grep -q '"pass"' || { echo "FAIL: /test"; exit 1; }
          echo "All smoke tests passed!"