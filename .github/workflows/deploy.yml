name: Deploy MLB Hit Predictor

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  S3_BUCKET: mlb-hit-predictor-production-bucket
  S3_KEY: code.zip

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Zip Lambda function code
        run: |
          zip -r code.zip mlb_hit_predictor

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::033896355668:role/mlb-cicd-role
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload ZIP to S3
        run: |
          aws s3 cp code.zip s3://${{ env.S3_BUCKET }}/${{ env.S3_KEY }}

      - name: Deploy CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: BeatTheStreak
          template: template.yaml
          parameter-overrides: >
            Environment=production
            PythonRuntime=python3.13
          capabilities: CAPABILITY_NAMED_IAM