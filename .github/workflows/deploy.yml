name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: beatthestreak
  ECS_STACK_NAME: beatthestreak-stack
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::033896355668:role/mlb-cicd-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:$IMAGE_TAG

      - name: Push Docker image to Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:$IMAGE_TAG

      - name: Deploy to ECS via CloudFormation
        run: |
          set +e
          echo "🟡 Deploying CloudFormation stack..."
          TIMESTAMP=$(date +%s)
          output=$(aws cloudformation deploy \
            --template-file ecs_stack.yaml \
            --stack-name $ECS_STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment=production \
              ImageUrl=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:$IMAGE_TAG \
              ContainerPort=80 \
              ForceRedeploy=$TIMESTAMP \
            --no-fail-on-empty-changeset 2>&1)
          status=$?

          echo "🔍 Raw CLI output:"
          echo "$output"

          if [[ $status -ne 0 ]]; then
            echo "🔴 Exit code: $status"
            if echo "$output" | grep -qi "no changes to deploy\|didn't contain changes\|no updates are to be performed\|^'Status'$"; then
              echo "✅ No changes detected or benign status output. Skipping failure."
              exit 0
            else
              echo "❌ CloudFormation deploy failed"
              exit $status
            fi
          fi
