name: Deploy to Production (main branch)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mlb-cicd-role
          role-session-name: github-cicd-session
          aws-region: us-east-1

      - name: Deploy CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: mlb-hit-predictor
          template: template.yaml
          parameter-overrides: |
            GitHubOrg=${{ github.repository_owner }}
            GitHubRepo=${{ github.event.repository.name }}
            AWSAccountId=${{ secrets.AWS_ACCOUNT_ID }}
          capabilities: CAPABILITY_NAMED_IAM
