name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (assume role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::033896355668:role/mlb-cicd-role
          aws-region: us-east-1

      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: mlb-hit-predictor
          template: template.yaml
          capabilities: CAPABILITY_NAMED_IAM
          no-execute-changeset: false
          no-delete-failed-changeset: false
          no-fail-on-empty-changeset: false
          disable-rollback: false
          termination-protection: false
