name: Deploy to Production (main branch)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::033896355668:role/mlb-cicd-role
          role-session-name: github-cicd-session
          aws-region: us-east-1

      - name: Deploy CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: mlb-hit-predictor
          template: template.yaml
          parameter-overrides: |
            GitHubOrg=dnbroder
            GitHubRepo=BeatTheStreak
            AWSAccountId=033896355668
            Environment=production
          capabilities: CAPABILITY_NAMED_IAM
          no-execute-changeset: false
          no-delete-failed-changeset: false
          no-fail-on-empty-changeset: false
          disable-rollback: false
          termination-protection: false
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1