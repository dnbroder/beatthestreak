name: Update Live Results

on:
  schedule:
    - cron: '0 17 * * *'  # 1 PM ET daily (after morning predictions)
  workflow_dispatch:       # manual trigger anytime

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mlb-cicd-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: pip install boto3

      - name: Fetch latest results and update README
        run: python3 .github/scripts/update_readme_results.py

      - name: Commit updated README
        run: |
          git config user.name "BeatTheStreak Bot"
          git config user.email "bot@beatthestreak.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update live season results [skip ci]"
          git push