AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate Deployment for BeatTheStreak

Parameters:
  Environment:
    Type: String
    Default: test
    AllowedValues:
      - production
      - test
  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag (set by CI/CD pipeline)
  ContainerPort:
    Type: Number
    Default: 8080
  ForceRedeploy:
    Type: String
    Description: Dummy value to force TaskDefinition redeployment
    Default: init
  EnableScheduledPredictions:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable daily EventBridge triggers (production only)

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  ScheduleEnabled: !And
    - !Equals [!Ref EnableScheduledPredictions, "true"]
    - !Condition IsProduction

Resources:

  # ===========================================================================
  # NETWORKING
  # ===========================================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  # ===========================================================================
  # ECS CLUSTER + SERVICE
  # ===========================================================================

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${Environment}-cluster

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: ECSExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: AppS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - kms:GenerateDataKey
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Environment}-task-${ForceRedeploy}
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/beatthestreak:${ImageTag}
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Essential: true
          Environment:
            - Name: S3_BUCKET_NAME
              Value: ""
            - Name: ENVIRONMENT
              Value: !Ref Environment
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 15
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${Environment}
      RetentionInDays: 14

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Access to ${Environment} ECS Service
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: AttachGateway
    Properties:
      Cluster: !Ref ECSCluster
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      TaskDefinition: !Ref TaskDefinition

  # ===========================================================================
  # EVENTBRIDGE + LAMBDA (production only, when enabled)
  # ===========================================================================

  # Lambda function that discovers the Fargate task IP and hits /predict/daily
  PredictionTriggerFunction:
    Type: AWS::Lambda::Function
    Condition: ScheduleEnabled
    Properties:
      FunctionName: !Sub ${Environment}-prediction-trigger
      Runtime: python3.12
      Handler: prediction_trigger.handler
      Timeout: 900
      MemorySize: 128
      Role: !GetAtt PredictionTriggerRole.Arn
      Environment:
        Variables:
          ECS_CLUSTER: !Sub ${Environment}-cluster
          CONTAINER_PORT: !Ref ContainerPort
          TRIGGER_TYPE: "scheduled"
          ENVIRONMENT: !Ref Environment
      Code:
        S3Bucket: !Sub mlb-hit-predictor-${Environment}-bucket
        S3Key: lambda/prediction_trigger.zip

  # IAM role for the Lambda — needs ECS + EC2 read access
  PredictionTriggerRole:
    Type: AWS::IAM::Role
    Condition: ScheduleEnabled
    Properties:
      RoleName: !Sub ${Environment}-prediction-trigger-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PredictionTriggerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudWatch Logs for Lambda
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
              # ECS read access to discover task IP
              - Effect: Allow
                Action:
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                Resource: "*"
              # EC2 read access to get public IP from ENI
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"
              # S3 write access for no-games marker
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::mlb-hit-predictor-${Environment}-bucket/predictions/*"

  # Lambda log group
  PredictionTriggerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ScheduleEnabled
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-prediction-trigger
      RetentionInDays: 14

  # --------------------------------------------------------------------------
  # Morning trigger: 11:30 AM ET (16:30 UTC) — day game lineups
  # --------------------------------------------------------------------------
  MorningPredictionRule:
    Type: AWS::Events::Rule
    Condition: ScheduleEnabled
    Properties:
      Name: !Sub ${Environment}-morning-predictions
      Description: "Morning prediction run - day game lineups (11:30 AM ET)"
      ScheduleExpression: "cron(30 16 * 3-10 ? *)"
      State: ENABLED
      Targets:
        - Id: MorningPredictionTarget
          Arn: !GetAtt PredictionTriggerFunction.Arn
          Input: '{"trigger": "morning"}'

  MorningPredictionPermission:
    Type: AWS::Lambda::Permission
    Condition: ScheduleEnabled
    Properties:
      FunctionName: !Ref PredictionTriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MorningPredictionRule.Arn

  # --------------------------------------------------------------------------
  # Evening trigger: 5:00 PM ET (22:00 UTC) — night game lineups
  # --------------------------------------------------------------------------
  EveningPredictionRule:
    Type: AWS::Events::Rule
    Condition: ScheduleEnabled
    Properties:
      Name: !Sub ${Environment}-evening-predictions
      Description: "Evening prediction run - night game lineups (5:00 PM ET)"
      ScheduleExpression: "cron(0 22 * 3-10 ? *)"
      State: ENABLED
      Targets:
        - Id: EveningPredictionTarget
          Arn: !GetAtt PredictionTriggerFunction.Arn
          Input: '{"trigger": "evening"}'

  EveningPredictionPermission:
    Type: AWS::Lambda::Permission
    Condition: ScheduleEnabled
    Properties:
      FunctionName: !Ref PredictionTriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EveningPredictionRule.Arn

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
  ServiceName:
    Value: !GetAtt ECSService.Name
  LogGroup:
    Value: !Ref LogGroup
    Description: CloudWatch log group - check /ecs/<environment> in CloudWatch
  Environment:
    Value: !Ref Environment
  MorningSchedule:
    Condition: ScheduleEnabled
    Value: "11:30 AM ET daily (March-October)"
    Description: Morning prediction trigger for day game lineups
  EveningSchedule:
    Condition: ScheduleEnabled
    Value: "5:00 PM ET daily (March-October)"
    Description: Evening prediction trigger for night game lineups
  PredictionTriggerLambda:
    Condition: ScheduleEnabled
    Value: !Ref PredictionTriggerFunction
    Description: Lambda function that triggers daily predictions