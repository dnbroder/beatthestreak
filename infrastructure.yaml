AWSTemplateFormatVersion: '2010-09-09'
Description: BeatTheStreak — ECS Fargate + EventBridge + API Gateway

Parameters:
  Environment:
    Type: String
    Default: test
    AllowedValues:
      - production
      - test
  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag (set by CI/CD pipeline)
  ContainerPort:
    Type: Number
    Default: 8080
  ForceRedeploy:
    Type: String
    Description: Dummy value to force TaskDefinition redeployment
    Default: init
  EnableScheduledPredictions:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable daily EventBridge triggers (production only)
  EnablePublicAPI:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable API Gateway + ALB for customer-facing API (production only)
  EnableAutoRetrain:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable annual pre-season model retraining (production only)
  AlertEmail:
    Type: String
    Default: ""
    Description: Email for SNS alerts (retrain results, accuracy warnings)
  DomainName:
    Type: String
    Default: ""
    Description: Custom API domain (e.g. api.beatthestreak.com). Leave blank for default Gateway URL.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for custom domain. Required if DomainName is set.
  PandasLayerSsmPath:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /aws/service/aws-sdk-pandas/3.15.1/py3.12/x86_64/layer-arn
    Description: >-
      SSM public parameter path that resolves to the AWS SDK for pandas Lambda
      layer ARN. This layer bundles pandas + pyarrow + numpy for the Lambda
      runtime. Used by the ActualsCheckerFunction to enrich predictions_log
      parquet files with actual hit results. Bump the version segment when
      AWS publishes a new release (check https://github.com/aws/aws-sdk-pandas/releases).

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  ScheduleEnabled: !And
    - !Equals [!Ref EnableScheduledPredictions, "true"]
    - !Condition IsProduction
  APIEnabled: !And
    - !Equals [!Ref EnablePublicAPI, "true"]
    - !Condition IsProduction
  RetrainEnabled: !And
    - !Equals [!Ref EnableAutoRetrain, "true"]
    - !Condition IsProduction
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Condition APIEnabled

Resources:

  # ===========================================================================
  # NETWORKING
  # ===========================================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  # ===========================================================================
  # ECS CLUSTER + SERVICE
  # ===========================================================================

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${Environment}-cluster

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: ECSExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: AppS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - kms:GenerateDataKey
                Resource: "*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Environment}-task-${ForceRedeploy}
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/beatthestreak:${ImageTag}
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Essential: true
          Environment:
            - Name: S3_BUCKET_NAME
              Value: ""
            - Name: ENVIRONMENT
              Value: !Ref Environment
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 15
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${Environment}
      RetentionInDays: 14

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Access to ${Environment} ECS Service
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: AttachGateway
    Properties:
      Cluster: !Ref ECSCluster
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      TaskDefinition: !Ref TaskDefinition

  # ===========================================================================
  # EVENTBRIDGE + LAMBDA (production only, when enabled)
  # ===========================================================================

  # Lambda function that discovers the Fargate task IP and hits /predict/daily
  PredictionTriggerFunction:
    Type: AWS::Lambda::Function
    Condition: ScheduleEnabled
    Properties:
      FunctionName: !Sub ${Environment}-prediction-trigger
      Runtime: python3.12
      Handler: prediction_trigger.handler
      Timeout: 900
      MemorySize: 128
      Role: !GetAtt PredictionTriggerRole.Arn
      Environment:
        Variables:
          ECS_CLUSTER: !Sub ${Environment}-cluster
          CONTAINER_PORT: !Ref ContainerPort
          TRIGGER_TYPE: "scheduled"
          ENVIRONMENT: !Ref Environment
      Code:
        S3Bucket: !Sub mlb-hit-predictor-${Environment}-bucket
        S3Key: lambda/prediction_trigger.zip

  PredictionTriggerRole:
    Type: AWS::IAM::Role
    Condition: ScheduleEnabled
    Properties:
      RoleName: !Sub ${Environment}-prediction-trigger-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PredictionTriggerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
              - Effect: Allow
                Action:
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::mlb-hit-predictor-${Environment}-bucket/predictions/*"

  PredictionTriggerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ScheduleEnabled
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-prediction-trigger
      RetentionInDays: 14

  # Morning trigger: 11:30 AM ET (16:30 UTC)
  MorningPredictionRule:
    Type: AWS::Events::Rule
    Condition: ScheduleEnabled
    Properties:
      Name: !Sub ${Environment}-morning-predictions
      Description: "Morning prediction run - day game lineups (11:30 AM ET)"
      ScheduleExpression: "cron(30 16 * 3-10 ? *)"
      State: ENABLED
      Targets:
        - Id: MorningPredictionTarget
          Arn: !GetAtt PredictionTriggerFunction.Arn
          Input: '{"trigger": "morning"}'

  MorningPredictionPermission:
    Type: AWS::Lambda::Permission
    Condition: ScheduleEnabled
    Properties:
      FunctionName: !Ref PredictionTriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MorningPredictionRule.Arn

  # Evening trigger: 5:00 PM ET (22:00 UTC)
  EveningPredictionRule:
    Type: AWS::Events::Rule
    Condition: ScheduleEnabled
    Properties:
      Name: !Sub ${Environment}-evening-predictions
      Description: "Evening prediction run - night game lineups (5:00 PM ET)"
      ScheduleExpression: "cron(0 22 * 3-10 ? *)"
      State: ENABLED
      Targets:
        - Id: EveningPredictionTarget
          Arn: !GetAtt PredictionTriggerFunction.Arn
          Input: '{"trigger": "evening"}'

  EveningPredictionPermission:
    Type: AWS::Lambda::Permission
    Condition: ScheduleEnabled
    Properties:
      FunctionName: !Ref PredictionTriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EveningPredictionRule.Arn

  # ===========================================================================
  # ACTUALS CHECKER — Fills previous day hit/miss results (production only)
  # ===========================================================================

  ActualsCheckerFunction:
    Type: AWS::Lambda::Function
    Condition: ScheduleEnabled
    Properties:
      FunctionName: !Sub ${Environment}-actuals-checker
      Runtime: python3.12
      Handler: check_actuals.handler
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt ActualsCheckerRole.Arn
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Layers:
        # AWS-managed layer providing pandas + pyarrow + numpy for Lambda.
        # Resolved at deploy time from SSM (see PandasLayerSsmPath parameter).
        # Used by predictions_log.append_actuals to write parquet enrichment.
        - !Ref PandasLayerSsmPath
      Code:
        S3Bucket: !Sub mlb-hit-predictor-${Environment}-bucket
        S3Key: lambda/check_actuals.zip

  ActualsCheckerRole:
    Type: AWS::IAM::Role
    Condition: ScheduleEnabled
    Properties:
      RoleName: !Sub ${Environment}-actuals-checker-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ActualsCheckerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::mlb-hit-predictor-${Environment}-bucket/predictions/*"
                  - !Sub "arn:aws:s3:::mlb-hit-predictor-${Environment}-bucket/predictions_log/*"

  ActualsCheckerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ScheduleEnabled
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-actuals-checker
      RetentionInDays: 14

  # v1.5.2 HEALTH monitoring: extract WARNING-level health signals from the
  # actuals checker Lambda logs and alert on elevated rates. The filter
  # pattern matches "[HEALTH] WARNING:" so informational [HEALTH] lines
  # (cold-start probes, tier summaries) don't trigger it — only explicit
  # warnings do. See daily_predictions.py / check_actuals.py / predictions_log.py
  # for the sites that emit these.
  ActualsCheckerHealthFilter:
    Type: AWS::Logs::MetricFilter
    Condition: ScheduleEnabled
    Properties:
      LogGroupName: !Ref ActualsCheckerLogGroup
      FilterPattern: '"[HEALTH] WARNING"'
      MetricTransformations:
        - MetricNamespace: !Sub BeatTheStreak/${Environment}
          MetricName: HealthWarnings
          MetricValue: "1"
          DefaultValue: 0

  ActualsCheckerHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: !Sub ${Environment}-actuals-checker-health-warnings
      AlarmDescription: >
        Fires when the actuals checker Lambda emits 3 or more [HEALTH] WARNING
        lines in a 24-hour window. Leading indicator of systemic issues like
        MLB Stats API regressions, pandas layer drops, or widespread
        name-match failures.
      Namespace: !Sub BeatTheStreak/${Environment}
      MetricName: HealthWarnings
      Statistic: Sum
      Period: 86400  # 24 hours
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # Actuals check: 10:00 AM ET (14:00 UTC) — runs before morning prediction trigger
  ActualsCheckerRule:
    Type: AWS::Events::Rule
    Condition: ScheduleEnabled
    Properties:
      Name: !Sub ${Environment}-actuals-checker
      Description: "Morning actuals check — fill yesterday's hit/miss results (10:00 AM ET)"
      ScheduleExpression: "cron(0 14 * 3-10 ? *)"
      State: ENABLED
      Targets:
        - Id: ActualsCheckerTarget
          Arn: !GetAtt ActualsCheckerFunction.Arn
          Input: '{"trigger": "morning_actuals"}'

  ActualsCheckerPermission:
    Type: AWS::Lambda::Permission
    Condition: ScheduleEnabled
    Properties:
      FunctionName: !Ref ActualsCheckerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ActualsCheckerRule.Arn

  # ===========================================================================
  # AUTO-RETRAIN — Annual pre-season model retraining (production only)
  # ===========================================================================

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub ${Environment}-beatthestreak-alerts
      DisplayName: BeatTheStreak Alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ModelRetrainerFunction:
    Type: AWS::Lambda::Function
    Condition: RetrainEnabled
    Properties:
      FunctionName: !Sub ${Environment}-model-retrainer
      Runtime: python3.12
      Handler: model_retrainer.handler
      Timeout: 900
      MemorySize: 128
      Role: !GetAtt ModelRetrainerRole.Arn
      Environment:
        Variables:
          ECS_CLUSTER: !Sub ${Environment}-cluster
          CONTAINER_PORT: !Ref ContainerPort
          ENVIRONMENT: !Ref Environment
          SNS_TOPIC_ARN: !If
            - HasAlertEmail
            - !Ref AlertTopic
            - ""
      Code:
        S3Bucket: !Sub mlb-hit-predictor-${Environment}-bucket
        S3Key: lambda/model_retrainer.zip

  ModelRetrainerRole:
    Type: AWS::IAM::Role
    Condition: RetrainEnabled
    Properties:
      RoleName: !Sub ${Environment}-model-retrainer-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ModelRetrainerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
              - Effect: Allow
                Action:
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"

  ModelRetrainerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: RetrainEnabled
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-model-retrainer
      RetentionInDays: 30

  AnnualRetrainRule:
    Type: AWS::Events::Rule
    Condition: RetrainEnabled
    Properties:
      Name: !Sub ${Environment}-annual-retrain
      Description: "Annual pre-season model retrain (Feb 15, 10:00 AM ET)"
      ScheduleExpression: "cron(0 15 15 2 ? *)"
      State: ENABLED
      Targets:
        - Id: AnnualRetrainTarget
          Arn: !GetAtt ModelRetrainerFunction.Arn
          Input: '{"trigger": "annual_retrain"}'

  AnnualRetrainPermission:
    Type: AWS::Lambda::Permission
    Condition: RetrainEnabled
    Properties:
      FunctionName: !Ref ModelRetrainerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AnnualRetrainRule.Arn

  # ===========================================================================
  # PUBLIC API — API GATEWAY V2 (HTTP API) + ALB (production only, when enabled)
  # ===========================================================================
  # Uses AWS::ApiGatewayV2 (HTTP API) instead of REST API (v1).
  # HTTP API connects directly to the ALB via VPC Link — no NLB needed.
  # Benefits: lower latency, 70% cheaper, native JWT auth, ALB direct support.
  # All sports models (baseball, golf, basketball) share this single gateway.
  # ===========================================================================

  # VPC Link connects HTTP API Gateway directly to internal ALB
  VpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Condition: APIEnabled
    Properties:
      Name: !Sub ${Environment}-bts-vpc-link
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroupIds:
        - !Ref ALBSecurityGroup

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: APIEnabled
    Properties:
      GroupDescription: !Sub ${Environment} ALB - API Gateway traffic
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 10.0.0.0/16

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: APIEnabled
    Properties:
      Name: !Sub ${Environment}-bts-alb
      Scheme: internal
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: APIEnabled
    Properties:
      Name: !Sub ${Environment}-bts-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: APIEnabled
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # HTTP API (v2)
  BeatTheStreakAPI:
    Type: AWS::ApiGatewayV2::Api
    Condition: APIEnabled
    Properties:
      Name: !Sub ${Environment}-beatthestreak-api
      Description: BeatTheStreak Multi-Sport Prediction API
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
          - x-api-key

  # API Stage
  APIStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      StageName: !Ref Environment
      AutoDeploy: true
      Tags: {}
      DefaultRouteSettings:
        ThrottlingRateLimit: 100
        ThrottlingBurstLimit: 200

  # ALB integration — all routes proxy through to ECS via ALB
  ALBIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !GetAtt ALBListener.ListenerArn
      ConnectionType: VPC_LINK
      ConnectionId: !Ref VpcLink
      PayloadFormatVersion: "1.0"

  # --------------------------------------------------------------------------
  # Routes — Baseball
  # --------------------------------------------------------------------------

  RouteBaseballPicksDaily:
    Type: AWS::ApiGatewayV2::Route
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      RouteKey: "GET /v1/baseball/picks/daily"
      AuthorizationType: NONE
      ApiKeyRequired: false
      Target: !Sub integrations/${ALBIntegration}

  RouteBaseballPicksByDate:
    Type: AWS::ApiGatewayV2::Route
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      RouteKey: "GET /v1/baseball/picks/{date}"
      AuthorizationType: NONE
      ApiKeyRequired: false
      Target: !Sub integrations/${ALBIntegration}

  RouteBaseballConfidence:
    Type: AWS::ApiGatewayV2::Route
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      RouteKey: "GET /v1/baseball/confidence/{player_id}"
      AuthorizationType: NONE
      ApiKeyRequired: false
      Target: !Sub integrations/${ALBIntegration}

  # --------------------------------------------------------------------------
  # Routes — Golf
  # --------------------------------------------------------------------------

  RouteGolfPicksTournament:
    Type: AWS::ApiGatewayV2::Route
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      RouteKey: "GET /v1/golf/picks/tournament"
      AuthorizationType: NONE
      ApiKeyRequired: false
      Target: !Sub integrations/${ALBIntegration}

  RouteGolfPicksByDate:
    Type: AWS::ApiGatewayV2::Route
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      RouteKey: "GET /v1/golf/picks/{date}"
      AuthorizationType: NONE
      ApiKeyRequired: false
      Target: !Sub integrations/${ALBIntegration}

  # --------------------------------------------------------------------------
  # Routes — Basketball
  # --------------------------------------------------------------------------

  RouteNBAPicksDaily:
    Type: AWS::ApiGatewayV2::Route
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      RouteKey: "GET /v1/basketball/picks/daily"
      AuthorizationType: NONE
      ApiKeyRequired: false
      Target: !Sub integrations/${ALBIntegration}

  RouteNBAPicksByDate:
    Type: AWS::ApiGatewayV2::Route
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      RouteKey: "GET /v1/basketball/picks/{date}"
      AuthorizationType: NONE
      ApiKeyRequired: false
      Target: !Sub integrations/${ALBIntegration}

  # --------------------------------------------------------------------------
  # Shared routes — health + meta (no auth)
  # --------------------------------------------------------------------------

  RouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      RouteKey: "GET /v1/health"
      AuthorizationType: NONE
      ApiKeyRequired: false
      Target: !Sub integrations/${ALBIntegration}

  RouteMeta:
    Type: AWS::ApiGatewayV2::Route
    Condition: APIEnabled
    Properties:
      ApiId: !Ref BeatTheStreakAPI
      RouteKey: "GET /v1/meta"
      AuthorizationType: NONE
      ApiKeyRequired: false
      Target: !Sub integrations/${ALBIntegration}

  # API Gateway CloudWatch logs
  APILogGroup:
    Type: AWS::Logs::LogGroup
    Condition: APIEnabled
    Properties:
      LogGroupName: !Sub /aws/apigateway/${Environment}-beatthestreak-api
      RetentionInDays: 30

  # Custom Domain (optional)
  CustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL

  DomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    DependsOn: APIStage
    Properties:
      DomainName: !Ref CustomDomain
      ApiId: !Ref BeatTheStreakAPI
      Stage: !Ref Environment

  # ===========================================================================
  # ANALYTICS — Glue catalog + Athena workgroup for QuickSight (v1.5)
  # ===========================================================================
  # Predictions log layout:
  #   s3://mlb-hit-predictor-${Environment}-bucket/predictions_log/
  #     dt=YYYY-MM-DD/predictions.parquet
  #
  # QuickSight connects to Athena, Athena queries the Glue table, the Glue
  # table is a thin metadata layer over the parquet partitions. No data
  # movement, no ETL job, no extra storage cost beyond the parquet itself.
  #
  # Athena partition projection eliminates the need for MSCK REPAIR or a
  # Glue crawler — new dt= partitions are inferred from the date range
  # the moment they land in S3.

  AnalyticsGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub beatthestreak_analytics_${Environment}
        Description: BeatTheStreak prediction log + future DK optimizer tables

  PredictionsLogGlueTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref AnalyticsGlueDatabase
      TableInput:
        Name: predictions_log
        Description: One row per BeatTheStreak prediction, enriched with actuals
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
          "projection.enabled": "true"
          "projection.dt.type": "date"
          "projection.dt.format": "yyyy-MM-dd"
          "projection.dt.range": "2026-03-25,NOW"
          "projection.dt.interval": "1"
          "projection.dt.interval.unit": "DAYS"
          "storage.location.template": !Sub "s3://mlb-hit-predictor-${Environment}-bucket/predictions_log/dt=${!dt}"
        PartitionKeys:
          - Name: dt
            Type: date
        StorageDescriptor:
          Location: !Sub s3://mlb-hit-predictor-${Environment}-bucket/predictions_log/
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            # ----- identity -----
            - { Name: game_date,            Type: string }
            - { Name: player_id,            Type: bigint }
            - { Name: player_name,          Type: string }
            - { Name: team,                 Type: string }
            - { Name: opponent,             Type: string }
            - { Name: venue,                Type: string }
            - { Name: is_home,              Type: boolean }
            # ----- lineup / matchup -----
            - { Name: lineup_position,      Type: int }
            - { Name: bat_side,             Type: string }
            - { Name: opp_pitcher,          Type: string }
            - { Name: opp_pitcher_hand,     Type: string }
            - { Name: is_doubleheader,      Type: boolean }
            - { Name: game_number,          Type: int }
            - { Name: is_confirmed_starter, Type: boolean }
            # ----- model output -----
            - { Name: rank,                 Type: int }
            - { Name: predicted_prob,       Type: double }
            - { Name: confidence_pct,       Type: double }
            - { Name: model_version,        Type: string }
            # ----- precomputed top-N flags -----
            - { Name: is_top_1,             Type: boolean }
            - { Name: is_top_2,             Type: boolean }
            - { Name: is_top_5,             Type: boolean }
            - { Name: is_top_10,            Type: boolean }
            - { Name: is_top_25,            Type: boolean }
            - { Name: is_top_50,            Type: boolean }
            # ----- key features -----
            - { Name: batting_avg_season,   Type: double }
            - { Name: avg_last_30,          Type: double }
            - { Name: aabbh,                Type: double }
            - { Name: aabbh_ratio,          Type: double }
            - { Name: in_optimal_zone,      Type: boolean }
            - { Name: platoon_advantage,    Type: boolean }
            - { Name: pitcher_era,          Type: double }
            - { Name: pitcher_whip,         Type: double }
            - { Name: park_factor,          Type: double }
            # ----- actuals (filled by check_actuals after games complete) -----
            - { Name: actual_hit,           Type: boolean }
            - { Name: actual_ab_count,      Type: int }
            - { Name: actual_hit_count,     Type: int }
            - { Name: actuals_resolved_at,  Type: string }

  AnalyticsAthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub beatthestreak-analytics-${Environment}
      Description: Workgroup for QuickSight + ad-hoc Athena queries against predictions_log
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub s3://mlb-hit-predictor-${Environment}-bucket/athena_results/
        EngineVersion:
          SelectedEngineVersion: AUTO

# ===========================================================================
# OUTPUTS
# ===========================================================================

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
  ServiceName:
    Value: !GetAtt ECSService.Name
  LogGroup:
    Value: !Ref LogGroup
    Description: CloudWatch log group — check /ecs/<environment> in CloudWatch
  Environment:
    Value: !Ref Environment

  MorningSchedule:
    Condition: ScheduleEnabled
    Value: "11:30 AM ET daily (March-October)"
    Description: Morning prediction trigger for day game lineups
  EveningSchedule:
    Condition: ScheduleEnabled
    Value: "5:00 PM ET daily (March-October)"
    Description: Evening prediction trigger for night game lineups
  ActualsCheckerSchedule:
    Condition: ScheduleEnabled
    Value: "10:00 AM ET daily (March-October)"
    Description: Morning actuals checker — fills previous day results
  PredictionTriggerLambda:
    Condition: ScheduleEnabled
    Value: !Ref PredictionTriggerFunction
    Description: Lambda function that triggers daily predictions
  ActualsCheckerLambda:
    Condition: ScheduleEnabled
    Value: !Ref ActualsCheckerFunction
    Description: Lambda function that fills in previous day hit/miss results

  APIEndpoint:
    Condition: APIEnabled
    Value: !Sub https://${BeatTheStreakAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Description: Public API endpoint URL (HTTP API v2)
  CustomDomainURL:
    Condition: HasCustomDomain
    Value: !Sub https://${DomainName}
    Description: Custom domain URL
  ALBDnsName:
    Condition: APIEnabled
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Description: Internal ALB DNS (not publicly accessible)

  RetrainSchedule:
    Condition: RetrainEnabled
    Value: "February 15, 10:00 AM ET annually"
    Description: Annual model retrain trigger
  RetrainLambda:
    Condition: RetrainEnabled
    Value: !Ref ModelRetrainerFunction
    Description: Lambda function that retrains model pre-season
  AlertTopicArn:
    Condition: HasAlertEmail
    Value: !Ref AlertTopic
    Description: SNS topic for pipeline alerts

  AnalyticsGlueDatabase:
    Value: !Ref AnalyticsGlueDatabase
    Description: Glue database for QuickSight / Athena (v1.5)
  PredictionsLogTable:
    Value: !Sub ${AnalyticsGlueDatabase}.predictions_log
    Description: Fully-qualified Athena table for the analytics-grade prediction log
  AnalyticsAthenaWorkgroup:
    Value: !Ref AnalyticsAthenaWorkgroup
    Description: Athena workgroup to point QuickSight at