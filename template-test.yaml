AWSTemplateFormatVersion: '2010-09-09'
Description: MLB Hit Predictor Lambda Deployment - Test

Parameters:
  Environment:
    Type: String
    Default: "test"
    AllowedValues:
      - prod
      - test

Resources:
  PredictorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "mlb-hit-predictor-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "LambdaBasicExecution"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  PredictorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "mlb-hit-predictor-${Environment}"
      Handler: mlb_hit_predictor_test.lambda_handler
      Runtime: python3.11
      Role: !GetAtt PredictorLambdaRole.Arn
      Code:
        S3Bucket: !Sub "mlb-hit-predictor-code-${Environment}"
        S3Key: "mlb_hit_predictor_test.zip"
      Timeout: 30
      MemorySize: 256
