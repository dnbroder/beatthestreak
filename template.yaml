AWSTemplateFormatVersion: '2010-09-09'
Description: MLB Hit Predictor Lambda Deployment - Production
Parameters:
  Environment:
    Type: String
    Default: "production"
    AllowedValues:
      - production
      - test
  PythonRuntime:
    Type: String
    Default: python3.13
Resources:
  PredictorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "mlb-hit-predictor-${Environment}"
      Handler: mlb_hit_predictor.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: !Ref PythonRuntime
      Code:
        S3Bucket: !Sub "mlb-hit-predictor-${Environment}-bucket"
        S3Key: code.zip
      Timeout: 30
      MemorySize: 512

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "mlb-lambda-execution-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::mlb-hit-predictor-${Environment}-bucket"
                  - !Sub "arn:aws:s3:::mlb-hit-predictor-${Environment}-bucket/*"
              - Sid: AllowBasicLambda
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:InvokeFunction
                Resource: "*"

  CICDRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mlb-cicd-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: arn:aws:iam::033896355668:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:sub: repo:dnbroder/BeatTheStreak:ref:refs/heads/main
      Policies:
        - PolicyName: CICDPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationAccess
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                Resource: "*"
              - Sid: AllowGetLambdaExecutionRole
                Effect: Allow
                Action:
                  - iam:GetRole
                Resource: !GetAtt LambdaExecutionRole.Arn
              - Sid: PassRoleForLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt LambdaExecutionRole.Arn
