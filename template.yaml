AWSTemplateFormatVersion: '2010-09-09'
Description: MLB Hit Predictor Lambda Deployment - Production
Parameters:
  Environment:
    Type: String
    Default: "production"
    AllowedValues:
      - production
      - test
  PythonRuntime:
    Type: String
    Default: python3.11
Resources:
  PredictorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "mlb-hit-predictor-${Environment}"
      Handler: mlb_hit_predictor.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: !Ref PythonRuntime
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: code.zip
      Timeout: 30
      MemorySize: 512

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "mlb-lambda-execution-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::mlb-hit-predictor-${Environment}-bucket"
                  - !Sub "arn:aws:s3:::mlb-hit-predictor-${Environment}-bucket/*"
              - Sid: AllowBasicLambda
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:InvokeFunction
                Resource: "*"
